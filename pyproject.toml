[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acharge"
version = "1.0.0"
description = "A-Charge portfolio selection and adaptive fusion for EV charging forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==23.0.0",
  "scipy==1.16.0",
  "scikit-learn==1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
